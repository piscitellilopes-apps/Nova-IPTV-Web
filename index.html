<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><link rel="manifest" href="manifest.webmanifest"><title>Nova IPTV Web</title><style>body{margin:0;background:#101827;color:#eef3fa;font:15px system-ui}header{padding:20px;background:#18253a;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:23px}main{max-width:1000px;margin:auto;padding:18px}.panel{background:#1b2a40;border-radius:14px;padding:16px;margin:12px 0}input,select,button{font:inherit;border-radius:8px;padding:11px;border:1px solid #52627a;background:#101827;color:white;max-width:100%;box-sizing:border-box}input{width:100%;margin:5px 0 10px}button{background:#1e74dc;border:0;cursor:pointer}button.alt{background:#34445e}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.channel{background:#263955;text-align:left;min-height:66px}.muted{color:#adbad0}video{width:100%;background:#000;aspect-ratio:16/9}#status{min-height:22px}small{color:#adbad0}</style></head><body><header><h1>📺 NOVA IPTV <small>WEB</small></h1><span>● S24 Ultra</span></header><main><section class="panel"><h2>Profile</h2><label>Profil <select id="profile"><option value="1">Linie 1</option><option value="2">Linie 2</option></select></label><p class="muted">M3U-Playlist-URL eingeben. Zugangsdaten bleiben nur im Browser dieses Geräts gespeichert.</p><input id="url" type="url" placeholder="https://anbieter.example/playlist.m3u"><button id="save">Profil speichern</button> <button id="load" class="alt">Sender laden</button><p id="status" class="muted"></p></section><section class="panel"><h2>Live-TV</h2><input id="search" placeholder="Sender suchen"><div id="channels" class="grid"><p class="muted">Noch keine Sender geladen.</p></div></section><section class="panel"><h2 id="playing">Player</h2><video id="video" controls playsinline></video><p class="muted">HLS wird je nach Browser unterstützt. MPEG-TS und Cross-Origin-Streams können im Browser scheitern.</p></section></main><script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script><script>
const $=id=>document.getElementById(id);let channels=[],hls=null;function key(){return 'nova_profile_'+$('profile').value}function status(s){$('status').textContent=s}function restore(){$('url').value=localStorage.getItem(key())||''}restore();$('profile').onchange=()=>{restore();channels=[];render()};$('save').onclick=()=>{localStorage.setItem(key(),$('url').value.trim());status('Profil lokal gespeichert.')};function parseM3U(t){const lines=t.replace(/\r/g,'').split('\n');let result=[],name='',group='';for(let i=0;i<lines.length;i++){let line=lines[i].trim();if(line.startsWith('#EXTINF')){name=(line.split(',').slice(1).join(',')||'Unbenannter Sender').trim();group=(line.match(/group-title="([^"]*)"/)||[])[1]||''}else if(line&&!line.startsWith('#')){result.push({name:name||'Sender',group,url:line});name='';group=''}}return result}function render(){let q=$('search').value.toLowerCase();let shown=channels.filter(c=>(c.name+' '+c.group).toLowerCase().includes(q));$('channels').replaceChildren();if(!shown.length){let p=document.createElement('p');p.className='muted';p.textContent='Keine Sender gefunden.';$('channels').append(p)}shown.slice(0,600).forEach(c=>{let b=document.createElement('button');b.className='channel';b.textContent=c.name+(c.group?' · '+c.group:'');b.onclick=()=>play(c);$('channels').append(b)})} $('search').oninput=render;
async function play(c){$('playing').textContent=c.name;const v=$('video');if(hls){hls.destroy();hls=null}v.pause();v.removeAttribute('src');v.load();try{if(/\.m3u8(?:\?|$)/i.test(c.url)&&window.Hls&&Hls.isSupported()){hls=new Hls();hls.loadSource(c.url);hls.attachMedia(v)}else v.src=c.url;await v.play();status('Wiedergabe gestartet.')}catch(e){status('Wiedergabe nicht möglich: '+e.message+' (Format/HTTPS/CORS prüfen).')}}$('load').onclick=async()=>{const u=$('url').value.trim();if(!/^https:\/\//i.test(u)){status('Bitte eine HTTPS-Playlist-Adresse eingeben.');return}status('Lade Senderliste …');try{let r=await fetch(u);if(!r.ok)throw Error('HTTP '+r.status);channels=parseM3U(await r.text());render();status(channels.length+' Sender geladen.')}catch(e){status('Playlist konnte nicht geladen werden: '+e.message+'. Mögliche Ursache: CORS-Sperre des Anbieters.')}};
</script></body></html>
