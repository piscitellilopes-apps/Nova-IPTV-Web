<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><link rel="manifest" href="manifest.webmanifest"><title>Nova IPTV Web</title>
<style>body{margin:0;background:#101827;color:#eef3fa;font:15px system-ui}header{padding:20px;background:#18253a}main{max-width:1000px;margin:auto;padding:18px}.panel{background:#1b2a40;border-radius:14px;padding:16px;margin:12px 0}input,select,button,.import{font:inherit;border-radius:8px;padding:11px;border:1px solid #52627a;background:#101827;color:white;max-width:100%;box-sizing:border-box}input{width:100%;margin:5px 0 10px}button,.import{background:#1e74dc;border:0;cursor:pointer}.import{display:inline-block;margin-top:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.channel{background:#263955;text-align:left;min-height:66px}.muted,small{color:#adbad0}video{width:100%;background:#000;aspect-ratio:16/9}</style>
<header><h2>📺 NOVA IPTV <small>WEB · S24 Ultra</small></h2></header><main><section class="panel"><h2>Profile</h2><label>Profil <select id="profile"><option value="1">Linie 1</option><option value="2">Linie 2</option></select></label><p class="muted">M3U-Datei vom Handy importieren oder HTTPS-Playlist-Adresse verwenden.</p><input id="url" type="url" placeholder="https://anbieter.example/playlist.m3u"><button id="save">Profil speichern</button> <button id="load">Sender laden</button><div><label class="import" for="file">📂 M3U-Datei importieren</label><input id="file" type="file" accept=".m3u,.m3u8,.txt,audio/x-mpegurl,text/plain" style="display:none"></div><p id="status" class="muted" role="status"></p></section><section class="panel"><h2>Live-TV</h2><input id="search" placeholder="Sender suchen"><div id="channels" class="grid">Noch keine Sender geladen.</div></section><section class="panel"><h2 id="playing">Player</h2><video id="video" controls playsinline></video><p class="muted">Import funktioniert ohne Playlist-Fetch. HTTP-Streams, MPEG-TS und CORS können die Wiedergabe trotzdem verhindern.</p></section></main><script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script><script>
const $=id=>document.getElementById(id);let channels=[],hls=null;const key=()=> 'nova_profile_'+$('profile').value;const status=s=>$('status').textContent=s;function restore(){$('url').value=localStorage.getItem(key())||''}restore();$('profile').onchange=()=>{restore();channels=[];render()};$('save').onclick=()=>{localStorage.setItem(key(),$('url').value.trim());status('Profil lokal gespeichert.')};
function parseM3U(t){let out=[],name='',group='';for(const raw of t.replace(/\r/g,'').split('\n')){const line=raw.trim();if(line.startsWith('#EXTINF')){name=(line.split(',').slice(1).join(',')||'Unbenannter Sender').trim();group=(line.match(/group-title="([^"]*)"/)||[])[1]||''}else if(line&&!line.startsWith('#')){out.push({name:name||'Sender',group,url:line});name='';group=''}}return out}
function render(){let q=$('search').value.toLowerCase();$('channels').replaceChildren();const shown=channels.filter(c=>(c.name+' '+c.group).toLowerCase().includes(q));if(!shown.length){$('channels').textContent='Keine Sender gefunden.';return}shown.slice(0,600).forEach(c=>{let b=document.createElement('button');b.className='channel';b.textContent=c.name+(c.group?' · '+c.group:'');b.onclick=()=>play(c);$('channels').append(b)})}$('search').oninput=render;
async function play(c){$('playing').textContent=c.name;let v=$('video');if(hls){hls.destroy();hls=null}v.pause();v.removeAttribute('src');v.load();try{if(/\.m3u8(?:\?|$)/i.test(c.url)&&window.Hls&&Hls.isSupported()){hls=new Hls();hls.loadSource(c.url);hls.attachMedia(v)}else v.src=c.url;await v.play();status('Wiedergabe gestartet.')}catch(e){status('Wiedergabe nicht möglich: '+e.message+' (HTTPS/CORS/Format prüfen).')}}
$('file').onchange=async()=>{const f=$('file').files?.[0];if(!f)return;try{const found=parseM3U(await f.text());if(!found.length)throw Error('Keine Sender gefunden');channels=found;render();status(channels.length+' Sender aus '+f.name+' importiert.')}catch(e){status('Import fehlgeschlagen: '+e.message)}finally{$('file').value=''}};
$('load').onclick=async()=>{const u=$('url').value.trim();if(!/^https:\/\//i.test(u)){status('Bitte HTTPS-Adresse verwenden oder M3U-Datei importieren.');return}status('Lade Senderliste …');try{const r=await fetch(u);if(!r.ok)throw Error('HTTP '+r.status);channels=parseM3U(await r.text());render();status(channels.length+' Sender geladen.')}catch(e){status('Playlist konnte nicht geladen werden: '+e.message+' (mögliche CORS-Sperre).')}};
</script></html>
