<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c9eafa"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>IPTV-PIA</title><style>:root{font-family:system-ui,sans-serif;color-scheme:light;--accent:#8d69d9;--bg:#c9eafa;--surface:#ffffffbb;--text:#172c45}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);background-attachment:fixed;color:var(--text)}body{min-height:100dvh;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0}h1{font-size:18px;margin:0}button,select{border:1px solid #8885;border-radius:12px;padding:11px;background:var(--surface);color:var(--text);font:inherit}button{cursor:pointer}.nav{display:flex;gap:8px;margin:12px 0}.nav button{flex:1}.selected{background:var(--accent);color:white}main{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;height:calc(100dvh - 195px);min-height:280px}.panel{background:var(--surface);border:1px solid #fff8;border-radius:18px;padding:14px;overflow:auto;box-shadow:0 7px 28px #0001}.panel h2{font-size:15px;margin:0 0 12px}.empty{font-size:14px;line-height:1.55;opacity:.8}#settings{display:none;background:var(--surface);border-radius:16px;padding:12px;margin-bottom:8px}#settings.show{display:block}#settings select{width:100%;margin-top:8px}small{display:block;opacity:.7;margin-top:10px}@media(max-width:400px){header button{padding:8px;font-size:13px}}</style></head><body><header><h1>📺 IPTV-PIA</h1><div><button id="design">🎨 Design</button> <button id="full">⛶ Vollbild</button></div></header><section id="settings"><label>Design<select id="theme"><option value="aqua">Aqua Glass</option><option value="light">Hell</option><option value="night">Nacht</option><option value="color">Farbig</option><option value="cinema">Cinema</option><option value="neon">⚡ Neon Purple</option><option value="ocean">🌊 Ocean Blue</option><option value="emerald">💎 Emerald Glass</option><option value="sunset">🌅 Sunset Orange</option><option value="ferrari">🏎️ Ferrari Red</option><option value="inter">🔵 Inter Blue</option><option value="cyber">🌃 Cyberpunk</option><option value="arctic">❄️ Arctic Ice</option><option value="rose">🌹 Rose Gold</option><option value="galaxy">🌌 Midnight Galaxy</option></select></label><label>Akzentfarbe <input type="color" id="accent" value="#8d69d9"></label></section><section id="login" class="panel" style="margin-bottom:10px"><h2>IPTV-Zugang einrichten</h2><form id="credentials" style="display:grid;gap:8px"><input id="server" type="url" placeholder="Server-Adresse (https://…)" autocomplete="url" required style="padding:12px;border-radius:10px"><input id="user" placeholder="Benutzername" autocomplete="username" required style="padding:12px;border-radius:10px"><input id="pass" type="password" placeholder="Passwort" autocomplete="current-password" required style="padding:12px;border-radius:10px"><button type="submit">Verbinden und auf diesem Gerät merken</button></form><small id="status">Deine Daten werden nicht an GitHub gesendet. HTTP-Server benötigen eine gesicherte Vermittlung.</small></section><nav class="nav"><button class="selected" data-tab="Live">Live</button><button data-tab="Filme">Filme / VOD</button><button data-tab="Serien">Serien</button></nav><main><section class="panel"><h2>KATEGORIEN</h2><div id="categories" class="empty">Bitte zuerst verbinden.</div></section><section class="panel"><h2 id="title">LIVE-SENDER</h2><div id="streams" class="empty">Bitte zuerst verbinden.</div></section></main><script>const themes={aqua:['#c9eafa','#ffffffbb','#172c45'],light:['#f4f6fb','#ffffff','#26344b'],night:['#0d1728','#202d43','#eef5ff'],color:['#281647','#51317a','#fff3ff'],cinema:['#111113','#272525','#f5e8c6'],neon:['linear-gradient(145deg,#100728,#3d126b)','#311751dd','#f7eaff'],ocean:['linear-gradient(145deg,#073c66,#00a6c8)','#c3f8ffcc','#062f4a'],emerald:['linear-gradient(145deg,#064e3b,#28a48d)','#d5fff0cc','#073e35'],sunset:['linear-gradient(145deg,#521c6b,#f47742)','#fff1dddc','#43223c'],ferrari:['linear-gradient(145deg,#1b090c,#9c1128)','#401820ee','#fff1f1'],inter:['linear-gradient(145deg,#030d27,#135bc4)','#112b5cee','#f4f7ff'],cyber:['linear-gradient(145deg,#100a22,#073b49)','#24213eee','#edfffd'],arctic:['linear-gradient(145deg,#eafaff,#8ac4f2)','#ffffffdd','#193c67'],rose:['linear-gradient(145deg,#4e283b,#db9a9e)','#ffe4e7dd','#492a3d'],galaxy:['linear-gradient(145deg,#05071a,#36255f)','#1d1b3fee','#f2eeff']};const $=id=>document.getElementById(id);function apply(){let t=$('theme').value,c=themes[t]||themes.aqua;document.documentElement.style.setProperty('--bg',c[0]);document.documentElement.style.setProperty('--surface',c[1]);document.documentElement.style.setProperty('--text',c[2]);document.documentElement.style.setProperty('--accent',$('accent').value);localStorage.setItem('iptv-pia-theme',t);localStorage.setItem('iptv-pia-accent',$('accent').value)}$('theme').value=localStorage.getItem('iptv-pia-theme')||'aqua';$('accent').value=localStorage.getItem('iptv-pia-accent')||'#8d69d9';apply();$('theme').onchange=apply;$('accent').oninput=apply;$('design').onclick=()=>$('settings').classList.toggle('show');$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>alert('Der Browser erlaubt Vollbild hier nicht. Installiere IPTV-PIA über Zum Startbildschirm hinzufügen.'))};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('title').textContent=b.dataset.tab==='Live'?'LIVE-SENDER':b.dataset.tab.toUpperCase()});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});const credentialForm=$('credentials');let currentTab='Live';function saved(){try{return JSON.parse(localStorage.getItem('iptv-pia-credentials')||'null')}catch{return null}}function fill(){let c=saved();if(c){$('server').value=c.server;$('user').value=c.user;$('pass').value=c.pass}}fill();async function api(action){let c=saved();if(!c)throw Error('Bitte zuerst anmelden.');let u=new URL(c.server);if(u.protocol!=='https:')throw Error('Dein IPTV-Server verwendet HTTP. Für die Online-App ist zuerst ein geschützter HTTPS-Vermittlungsdienst nötig.');let endpoint=new URL('player_api.php',u.href.endsWith('/')?u.href:u.href+'/');endpoint.searchParams.set('username',c.user);endpoint.searchParams.set('password',c.pass);endpoint.searchParams.set('action',action);let ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),12000);try{let r=await fetch(endpoint,{signal:ctrl.signal,cache:'no-store'});if(!r.ok)throw Error('Server antwortet mit HTTP '+r.status);return await r.json()}finally{clearTimeout(timer)}}function msg(t){$('status').textContent=t}async function load(){const action=currentTab==='Live'?['get_live_categories','get_live_streams']:currentTab==='Filme'?['get_vod_categories','get_vod_streams']:['get_series_categories','get_series'];$('categories').textContent='Lade Kategorien …';$('streams').textContent='Lade Inhalte …';try{let [cats,items]=await Promise.all(action.map(api));if(!Array.isArray(cats)||!Array.isArray(items))throw Error('Der Server hat keine gültigen Listen zurückgegeben.');let chosen='';const draw=()=>{$('streams').replaceChildren();let list=items.filter(x=>!chosen||String(x.category_id)===chosen).slice(0,500);for(let x of list){let b=document.createElement('button');b.style.cssText='display:block;width:100%;text-align:left;margin:5px 0';b.textContent=x.name||x.title||'Ohne Titel';b.onclick=()=>msg('Inhalte geladen. Die sichere Wiedergabe ist noch nicht eingerichtet.');$('streams').append(b)}if(!list.length)$('streams').textContent='Keine Inhalte in dieser Kategorie.'};$('categories').replaceChildren();let all=document.createElement('button');all.textContent='Alle';all.onclick=()=>{chosen='';draw()};$('categories').append(all);for(let c of cats){let b=document.createElement('button');b.style.cssText='display:block;width:100%;text-align:left;margin:5px 0';b.textContent=c.category_name||'Kategorie';b.onclick=()=>{chosen=String(c.category_id);draw()};$('categories').append(b)}draw();msg('Kategorien und Inhalte geladen.')}catch(e){$('categories').textContent='Verbindung nicht möglich';$('streams').textContent=e.message||'Unbekannter Fehler';msg('Verbindung fehlgeschlagen: '+(e.message||'Fehler'))}}credentialForm.onsubmit=e=>{e.preventDefault();let c={server:$('server').value.trim(),user:$('user').value.trim(),pass:$('pass').value};localStorage.setItem('iptv-pia-credentials',JSON.stringify(c));load()};document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{currentTab=b.dataset.tab;if(saved())load()}));if(saved())load();</script></body></html>
